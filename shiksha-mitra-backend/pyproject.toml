[tool.poetry]
name = "shiksha-mitra-backend"
version = "0.1.0"
description = "Backend for Shiksha Mitra application"
authors = ["Ayush <ayush@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.95.0"
sqlalchemy = "^2.0.0"
sqlmodel = "^0.0.14"
psycopg2-binary = "^2.9.0"
uvicorn = {version = "^0.20.0", extras = ["standard"]}
pydantic-settings = "^2.0.0"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
passlib = {version = "^1.7.0", extras = ["bcrypt"]}
redis = "^4.0.0"
alembic = "^1.11.0"
python-multipart = "^0.0.6"
openai = "^1.59.6"
anthropic = "^0.40.0"
transformers = "^4.46.3"
torch = "^2.5.1"
pinecone-client = "^5.0.1"
python-socketio = "^5.11.4"
huggingface-hub = "^0.27.0"

# Auth dependencies
Authlib = "^1.3.0"
twilio = "^9.2.4"
fastapi-mail = "^1.4.1"
slowapi = "^0.1.9"
pyotp = "^2.8.0"
bcrypt = "^4.0.0"
pydantic = {version = "^2.4.0", extras = ["email"]}
aio-redis = "^0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
